<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drift Ledger</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>Drift Ledger</h1>
        <p id="activityStatus">Loading</p>
      </div>
    </div>
    <label class="switch" title="Toggle tracking">
      <input id="trackingToggle" type="checkbox" aria-label="Tracking enabled">
      <span></span>
    </label>
  </header>

  <main>
    <section class="focus-section" aria-labelledby="focusHeading">
      <div class="section-heading">
        <h2 id="focusHeading">Focus</h2>
        <span id="focusRemaining" hidden>25:00</span>
      </div>
      <div id="focusInactive" class="focus-row">
        <span>Start an intentional session</span>
        <button id="startFocusButton" class="button" type="button">Start</button>
      </div>
      <div id="focusActive" class="focus-row" hidden>
        <strong id="focusLabel">Focus session</strong>
        <button id="stopFocusButton" class="button" type="button">Stop</button>
      </div>
    </section>

    <section class="block-section" aria-labelledby="blockHeading">
      <div class="section-heading">
        <h2 id="blockHeading">Current block</h2>
        <span id="riskBadge" class="risk risk-low">Low</span>
      </div>
      <div class="block-metrics">
        <div>
          <strong id="blockDuration">0m</strong>
          <span>active</span>
        </div>
        <div>
          <strong id="navigationCount">0</strong>
          <span>navigations</span>
        </div>
        <div>
          <strong id="driftShare">0%</strong>
          <span>drift mix</span>
        </div>
      </div>
      <div id="blockDomains" class="domain-list"></div>
      <p id="blockState" class="block-state" hidden></p>
    </section>

    <section class="today-section" aria-labelledby="todayHeading">
      <div class="section-heading">
        <h2 id="todayHeading">Today</h2>
        <span id="todayTotal">0m</span>
      </div>
      <div id="categoryList" class="category-list"></div>
      <div class="budget-row">
        <span>Daily drift budget</span>
        <strong id="driftBudget">0m / 90m</strong>
      </div>
    </section>

    <section class="actions" aria-label="Current block actions">
      <button id="continueButton" class="button button-primary" type="button">Continue</button>
      <button id="snoozeButton" class="button" type="button">Remind in 15m</button>
      <button id="intentionalButton" class="button" type="button">Mark intentional</button>
    </section>
  </main>

  <footer>
    <button id="dashboardButton" class="text-button" type="button">Dashboard</button>
    <button id="optionsButton" class="text-button" type="button">Options</button>
    <button id="clearButton" class="text-button danger" type="button">Clear data</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
